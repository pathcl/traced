tempo:
  url: http://localhost:3200
  poll_interval: 5m
  lookback: 10m
  sample_limit: 200
  tenant_id: ""          # set to send X-Scope-OrgID; omit for single-tenant

mimir:
  url: http://localhost:9009
  tenant_id: ""          # same pattern as tempo

analysis:
  # span_attributes: [tenant, country]    # omit to auto-discover from live span data
  # baggage_header_attribute: ind.baggage.cj  # span attr that captures the W3C baggage header;
  #                                            # omit to auto-detect (looks for *.baggage attrs)
  root_anomaly_threshold: 0.001
  min_callee_count: 50

output:
  format: summary        # summary | json | table
